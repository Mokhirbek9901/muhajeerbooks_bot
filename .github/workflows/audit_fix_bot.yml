name: Bot final hardening

on:
  push:
    paths:
      - '.github/workflows/audit_fix_bot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final hardening
        run: python3 tools/audit_fix_bot.py
      - name: Compile check
        run: python3 -m py_compile bot.py sync_wrapper.py cloud_bridge.py app_image_sync.py
      - name: Critical invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          b = Path('bot.py').read_text(encoding='utf-8')
          s = Path('sync_wrapper.py').read_text(encoding='utf-8')
          assert 'STATS_RESET_ORDER_ID = 1788893918395' in b
          assert 'if dt.date()==now.date() and o.get("status") == "shipped"' in b
          assert 'paid_statuses = ("shipped",)' in b
          assert 'if o.get("status") == "shipped":' in b
          assert 'order.get("status") != "shipped"' in b
          assert 'books_total = max(0, received_total - delivery_fee)' in b
          assert 'ORDER_RESET_MARKER = os.path.join(DATA_DIR, "order_history_reset_20260908_v2.done")' in s
          assert '_order_reset_once()' in s
          print('Critical bot invariants OK')
          PY
      - name: Commit hardened runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py sync_wrapper.py
          git diff --cached --quiet && exit 0
          git commit -m 'Harden orders and start production statistics from zero'
          git push origin main
