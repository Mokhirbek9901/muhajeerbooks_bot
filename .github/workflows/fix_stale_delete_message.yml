name: Fix stale delete message

on:
  push:
    paths:
      - '.github/fix_stale_delete_message.py'
      - '.github/workflows/fix_stale_delete_message.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch bot
        run: python .github/fix_stale_delete_message.py
      - name: Validate
        run: |
          python -m py_compile bot.py cloud_bridge.py sync_wrapper.py
          grep -q 'Eski tugma ham tozalandi' bot.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Clear stale Telegram delete buttons'
          git push origin HEAD:main
