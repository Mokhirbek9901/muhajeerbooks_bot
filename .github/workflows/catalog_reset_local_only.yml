name: Catalog reset local hotfix

on:
  push:
    paths:
      - '.github/catalog_reset_local_only.py'
      - '.github/workflows/catalog_reset_local_only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: python .github/catalog_reset_local_only.py
      - name: Validate
        run: |
          python -m py_compile bot.py cloud_bridge.py sync_wrapper.py
          grep -q 'done_by_admin_sql' sync_wrapper.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sync_wrapper.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finish catalog reset without reset RPC'
          git push origin HEAD:main
