name: Fix app-bot order flow

on:
  push:
    paths:
      - '.github/workflows/fix_app_bot_order_flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: |
          sed -i "s/^accept_block = '''/accept_block = r'''/" .github/fix_app_bot_order_flow.py
          python .github/fix_app_bot_order_flow.py

      - name: Validate
        run: |
          python -m py_compile bot.py cloud_bridge.py sync_wrapper.py
          grep -q 'callback_data":f"accept_' bot.py
          grep -q 'Jo‘natildi — yakuniy holat' bot.py
          grep -q 'linked_chat = 0 if source == "app"' sync_wrapper.py
          grep -q 'Kitob server katalogidan o‘chirilmadi' cloud_bridge.py

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py cloud_bridge.py sync_wrapper.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix bot deletion and app order status flow'
          git pull --rebase origin main
          git push origin HEAD:main
