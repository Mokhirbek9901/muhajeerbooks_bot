name: Fuzzy book search

on:
  push:
    paths:
      - '.github/fuzzy-book-search.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python .github/fuzzy-book-search.py
      - name: Syntax check
        run: python -m py_compile bot.py
      - name: Verify fuzzy code
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('bot.py').read_text(encoding='utf-8')
          required=['from difflib import SequenceMatcher','def _search_key(value):','def _instagram_fuzzy_matches(query):','def search_books(query):','matches = _instagram_fuzzy_matches(query)']
          for x in required:
              assert x in t, x
          PY
      - name: Commit and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/fuzzy-book-search.py .github/fuzzy-book-search.trigger .github/workflows/fuzzy-book-search.yml
          git add -A
          git commit -m "Add typo-tolerant book search" || exit 0
          git push origin main
