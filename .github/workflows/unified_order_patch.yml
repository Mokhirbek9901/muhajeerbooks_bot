name: Unified order status patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unified_order_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch accepted app orders in Telegram admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
'''ORDER_STATUS_NAMES = {
    "pending": "🟡 Kutilmoqda", "paid": "🟢 To‘langan",
    "shipped": "🚚 Jo‘natilgan", "delivered": "✅ Yetkazilgan",
    "cancelled": "❌ Bekor qilingan", "stock_problem": "⚠️ Ombor muammosi"
}''',
'''ORDER_STATUS_NAMES = {
    "pending": "🟡 Kutilmoqda", "accepted": "📦 Qabul qilingan", "paid": "🟢 To‘langan",
    "shipped": "🚚 Jo‘natilgan", "delivered": "✅ Yetkazilgan",
    "cancelled": "❌ Bekor qilingan", "stock_problem": "⚠️ Ombor muammosi"
}''',1)

          old='''def admin_order_status_keyboard(order_id, status):
    buttons=[]
    if status == "pending":
        buttons.append([{ "text":"💳 To‘lov qilindi", "callback_data":f"paid_{order_id}" }])
        buttons.append([{ "text":"❌ Bekor qilish", "callback_data":f"cancelorder_{order_id}" }])
    elif status == "paid":
        buttons.append([{ "text":"🚚 Jo‘natildi", "callback_data":f"ship_{order_id}" }])
    buttons.append([{ "text":"⬅️ Buyurtmalar", "callback_data":"admin_orders" }])
    return {"inline_keyboard":buttons}
'''
          new='''def admin_order_status_keyboard(order_id, status):
    buttons=[]
    if status == "pending":
        buttons.append([{ "text":"💳 To‘lov qilindi", "callback_data":f"paid_{order_id}" }])
        buttons.append([{ "text":"❌ Bekor qilish", "callback_data":f"cancelorder_{order_id}" }])
    elif status == "accepted":
        # Programma adminida qabul qilingan buyurtmada stock allaqachon rezerv qilingan.
        buttons.append([{ "text":"💳 To‘lov qilindi", "callback_data":f"paid_{order_id}" }])
    elif status == "paid":
        buttons.append([{ "text":"🚚 Jo‘natildi", "callback_data":f"ship_{order_id}" }])
    buttons.append([{ "text":"⬅️ Buyurtmalar", "callback_data":"admin_orders" }])
    return {"inline_keyboard":buttons}
'''
          assert old in s
          s=s.replace(old,new,1)

          old2='''        if order["status"] != "pending":
            send(
                chat_id,
                "⚠️ Bu zakaz allaqachon qayta ishlangan."
            )
            return

        # Eng so‘nggi books.json ni bir marta yuklaymiz.
'''
          new2='''        if order["status"] not in ("pending", "accepted"):
            send(
                chat_id,
                "⚠️ Bu zakaz allaqachon qayta ishlangan."
            )
            return

        # Programma adminida "Qabul qilindi" bosilgan bo‘lsa, ombor cloud tomonda
        # allaqachon kamaygan. Bu yerda yana kamaytirmaymiz — faqat statusni o‘tkazamiz.
        if order["status"] == "accepted":
            order["status"] = "paid"
            save_orders()
            send(
                chat_id,
                f"✅ Zakaz №{order_id} to‘lov qilindi deb belgilandi.\n\n📦 Ombor avval rezerv qilingan.",
                admin_order_status_keyboard(order_id, "paid")
            )
            customer_chat = int(order.get("chat_id", 0) or 0)
            if customer_chat and customer_chat != int(chat_id):
                try:
                    send(
                        customer_chat,
                        "✅ BUYURTMANGIZ QABUL QILINDI!\n\n" + order_receipt_text(order) +
                        "\n\n📦 Kitoblaringiz pochtaga topshirilganda sizga alohida xabar yuboriladi.",
                        main_menu(customer_chat)
                    )
                except Exception as e:
                    print("Mijozga status yuborish xatosi:", e)
            return

        # Eng so‘nggi books.json ni bir marta yuklaymiz.
'''
          assert old2 in s
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: python3 -m py_compile bot.py sync_wrapper.py
      - name: Commit patch
        run: |
          rm .github/workflows/unified_order_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py .github/workflows/unified_order_patch.yml
          git commit -m "Handle unified app order statuses in bot"
          git push
