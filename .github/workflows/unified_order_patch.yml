name: Unified order status patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unified_order_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply order patch
        run: python3 tools/unified_order_patch.py
      - name: Syntax check
        run: python3 -m py_compile bot.py sync_wrapper.py
      - name: Commit patch
        run: |
          rm .github/workflows/unified_order_patch.yml
          rm tools/unified_order_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py .github/workflows/unified_order_patch.yml tools/unified_order_patch.py
          git commit -m "Handle unified app order statuses in bot"
          git push
