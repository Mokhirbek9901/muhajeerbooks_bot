name: Restore payment flow simple
on:
  push:
    paths:
      - '.github/restore-payment-flow-simple.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/restore_payment_flow.py
      - run: python -m py_compile bot.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet && exit 0
          git commit -m "Restore payment confirmation before shipping"
          git push origin main
