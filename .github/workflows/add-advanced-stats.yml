name: Add advanced statistics

on:
  push:
    paths:
      - ".github/add-advanced-stats.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch statistics
        env:
          PATCH_B64: ""
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Syntax check
        run: python -m py_compile bot.py
      - name: Commit bot.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet && exit 0
          git commit -m "Add advanced admin sales statistics"
          git push origin main
