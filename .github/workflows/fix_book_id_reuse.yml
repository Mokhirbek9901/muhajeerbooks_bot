name: Fix book ID reuse

on:
  push:
    paths:
      - '.github/workflows/fix_book_id_reuse.yml'
      - '.github/fix_book_id_reuse.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: python .github/fix_book_id_reuse.py
      - name: Validate
        run: |
          python -m py_compile bot.py
          grep -q 'Timestamp-asosli ID' bot.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prevent deleted book ID reuse'
          git push origin HEAD:main
