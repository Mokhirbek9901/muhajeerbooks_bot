name: Patch receipt warning

on:
  push:
    paths:
      - '.github/patch-receipt-warning.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add confirmation warning after receipt upload
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot.py')
          text = path.read_text(encoding='utf-8')

          old = '            "📸 To‘lov cheki yuborildi.\\n\\n"\n            + preview'
          new = (
              '            "📸 To‘lov cheki yuborildi.\\n\\n"\n'
              '            "⚠️ DIQQAT!\\n"\n'
              '            "Buyurtmani tugatish uchun «✅ Buyurtmani tasdiqlash» tugmasini bosing.\\n\\n"\n'
              '            + preview'
          )

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected receipt block once, found {count}')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Python syntax
        run: python -m py_compile bot.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet || git commit -m "Add receipt confirmation warning"
          git push
