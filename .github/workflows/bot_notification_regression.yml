name: App order notification dedup regression

on:
  push:
    paths:
      - "test_no_duplicate_app_order_telegram.py"
      - "bot_runtime_launcher.py"
      - "sync_wrapper.py"
      - ".github/workflows/bot_notification_regression.yml"
  pull_request:
    paths:
      - "bot_runtime_launcher.py"
      - "sync_wrapper.py"
      - "bot.py"
      - "test_no_duplicate_app_order_telegram.py"
      - ".github/workflows/bot_notification_regression.yml"

permissions:
  contents: read

jobs:
  verify-single-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check single Telegram notification and cloud sync safety
        run: python -m unittest -v test_no_duplicate_app_order_telegram
