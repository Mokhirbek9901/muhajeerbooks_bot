name: Admin features v2
on:
  push:
    paths:
      - '.github/admin-features-v2.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/admin_features_v2.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          idx=next(i for i,line in enumerate(lines) if "assasin-cost" in line)
          if "default-cost" not in lines[idx+1]:
              raise SystemExit('default-cost line not found')
          replacement=[
              "old_cost='            \"old_price\": 0,\\n            \"photo_id\": \"\",'",
              "if t.count(old_cost)!=2: raise RuntimeError(f'cost-defaults: {t.count(old_cost)}')",
              "t=t.replace(old_cost,'            \"old_price\": 0,\\n            \"cost_price\": 0,\\n            \"photo_id\": \"\",')",
          ]
          lines[idx:idx+2]=replacement
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Patch bot
        run: python .github/admin_features_v2.py
      - name: Syntax check
        run: python -m py_compile bot.py
      - name: Commit bot and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/admin_features_v2.py .github/admin-features-v2.trigger .github/workflows/admin-features-v2.yml
          git add bot.py .github
          git commit -m "Add admin stock, cost and profit tools"
          git push origin main