name: Automatic postage accounting
on:
  push:
    paths:
      - '.github/auto-postage.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch bot
        run: python .github/auto_postage.py
      - name: Syntax check
        run: python -m py_compile bot.py
      - name: Commit and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/auto_postage.py .github/auto-postage.trigger .github/workflows/auto-postage.yml
          git add bot.py .github
          git commit -m "Use automatic postage cost in reports"
          git push origin main
