name: Instagram sales entry
on:
  push:
    paths: ['.github/instagram-sales.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: python .github/instagram-sales.py
      - run: python -m py_compile bot.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/instagram-sales.py .github/instagram-sales.trigger .github/workflows/instagram-sales.yml
          git add bot.py .github
          git commit -m "Add easy Instagram sales entry"
          git push origin main
