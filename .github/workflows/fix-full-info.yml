name: Fix full customer info

on:
  push:
    paths:
      - '.github/fix-full-info.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch bot
        run: python .github/fix_full_info.py
      - name: Syntax check
        run: python -m py_compile bot.py
      - name: Commit bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet && exit 0
          git commit -m "Ask full details for alternate delivery"
          git push origin main
