name: Apply shared finance statistics fix

on:
  push:
    paths:
      - '.github/workflows/apply_shared_finance_stats.yml'
      - 'tools/fix_shared_finance_stats.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply finance statistics patch
        run: python tools/fix_shared_finance_stats.py
      - name: Syntax check
        run: python -m py_compile bot.py cloud_bridge.py
      - name: Commit patched bot
        run: |
          if git diff --quiet -- bot.py; then
            echo "No bot.py changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Use shared finance numbers in Telegram statistics"
          git push origin HEAD:main
