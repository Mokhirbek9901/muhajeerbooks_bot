name: Split backup patch v2

on:
  push:
    paths:
      - '.github/workflows/split_backup_patch_v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch bot
        run: python tools/split_backup_patch.py
      - name: Validate
        run: python -m py_compile bot.py sync_wrapper.py cloud_bridge.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Split backups and clear old order history"
          git push origin main
