name: Patch receipt confirmation

on:
  push:
    paths:
      - '.github/patch-receipt-confirmation.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update final confirmation wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot.py')
          text = path.read_text(encoding='utf-8')

          old = 'Tasdiqlaganingizdan so‘ng buyurtma admin tomonidan tekshiriladi va keyingi bosqichga o‘tadi.'
          new = 'Tasdiqlaganingizdan so‘ng buyurtma admin tomonidan tekshiriladi va buyurtma jo‘natish bosqichiga o‘tadi.'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Confirmation sentence expected once, found {count}')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Python syntax
        run: python -m py_compile bot.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet || git commit -m "Clarify order shipping step"
          git push
