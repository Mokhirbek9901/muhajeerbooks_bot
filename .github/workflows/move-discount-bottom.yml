name: Move discount button
on:
  push:
    paths: ['.github/move-discount-bottom.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: python .github/move-discount-bottom.py
      - run: python -m py_compile bot.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/move-discount-bottom.py .github/move-discount-bottom.trigger .github/workflows/move-discount-bottom.yml
          git add bot.py .github
          git commit -m "Move discount button to bottom of admin menu"
          git push origin main
