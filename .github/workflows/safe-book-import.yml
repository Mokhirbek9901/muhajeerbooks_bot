name: Safe book import
on:
  push:
    paths: ['.github/safe-book-import.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: python .github/safe-book-import.py
      - run: python -m py_compile bot.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/safe-book-import.py .github/safe-book-import.trigger .github/workflows/safe-book-import.yml
          git add bot.py .github
          git commit -m "Safely import new books into persistent inventory"
          git push origin main
