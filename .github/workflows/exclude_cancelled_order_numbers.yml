name: Exclude cancelled order numbers

on:
  push:
    branches: [main]
    paths:
      - 'tools/exclude_cancelled_order_numbers.py'
      - '.github/workflows/exclude_cancelled_order_numbers.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/exclude_cancelled_order_numbers.py
      - run: python -m py_compile bot.py cloud_bridge.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.py
          git commit -m "Do not number cancelled orders"
          git push
