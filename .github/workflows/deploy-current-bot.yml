name: Deploy current bot

on:
  push:
    paths:
      - ".github/deploy-current-bot.trigger"

permissions:
  contents: write

jobs:
  deploy-marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Touch bot safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          text = p.read_text(encoding='utf-8')
          marker = '\n# Advanced admin statistics enabled\n'
          if marker.strip() not in text:
              p.write_text(text.rstrip() + marker, encoding='utf-8')
          PY
      - name: Syntax check
        run: python -m py_compile bot.py
      - name: Commit bot.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet && exit 0
          git commit -m "Deploy advanced admin statistics"
          git push origin main
