name: Repair live bot app sync

on:
  push:
    paths:
      - '.github/fix-live-sync.trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply repair
        run: python .github/fix_live_sync.py
      - name: Syntax and sanity check
        run: |
          python -m py_compile bot.py sync_wrapper.py cloud_bridge.py app_image_sync.py
          python - <<'PY'
          from pathlib import Path
          s = Path('sync_wrapper.py').read_text(encoding='utf-8')
          assert '_sync_telegram_covers(' not in s
          assert '_merge_cloud(' not in s
          assert '_pull_rows(' not in s
          assert '_sync_app_images_to_telegram(rows, last_cloud_rows)' in s
          assert 'bot_sync_delete' in s
          assert 'bot_order_create' in s
          print('live sync repair OK')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync_wrapper.py
          git diff --cached --quiet && exit 0
          git commit -m "Repair conflict-safe live synchronization"
          git push origin main
