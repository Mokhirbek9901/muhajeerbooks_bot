name: Apply bot launch hardening 2026-09-10

on:
  push:
    branches: [main]
    paths:
      - 'tools/launch_hardening_20260910.py'
      - '.github/workflows/launch_hardening_20260910.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python3 tools/launch_hardening_20260910.py
      - name: Verify Python
        run: |
          python3 -m py_compile bot.py sync_wrapper.py cloud_bridge.py tools/launch_hardening_20260910.py
          python3 - <<'PY'
          from pathlib import Path
          bot = Path('bot.py').read_text(encoding='utf-8')
          sync = Path('sync_wrapper.py').read_text(encoding='utf-8')
          required_bot = ['editpage_', 'deletepage_', 'qstock_page_', 'start_payload.startswith("restock_")', 'Telegram API HTTP']
          required_sync = ['RESTOCK_FILE', '_notify_restock_transitions(latest_local, merged)']
          missing = [x for x in required_bot if x not in bot] + [x for x in required_sync if x not in sync]
          if missing:
              raise SystemExit(f'Missing launch hardening markers: {missing}')
          PY
      - name: Commit hardened bot
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py sync_wrapper.py
          git commit -m "Paginate admin menus and enable Telegram restock push"
          git push
