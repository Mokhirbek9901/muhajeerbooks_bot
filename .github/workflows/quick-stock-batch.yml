name: Quick stock batch update
on:
  push:
    paths:
      - '.github/quick-stock-batch.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch bot
        run: python .github/quick_stock_batch.py
      - name: Syntax check
        run: python -m py_compile bot.py
      - name: Commit and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/quick_stock_batch.py .github/quick-stock-batch.trigger .github/workflows/quick-stock-batch.yml
          git add bot.py .github
          git commit -m "Improve quick stock batch editing"
          git push origin main
