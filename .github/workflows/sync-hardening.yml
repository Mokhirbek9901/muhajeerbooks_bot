name: Sync hardening

on:
  push:
    branches: [main]
    paths:
      - 'sync_hardening_patch.py'
      - '.github/workflows/sync-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply sync hardening
        run: python3 sync_hardening_patch.py
      - name: Python syntax check
        run: python3 -m py_compile bot.py sync_wrapper.py cloud_bridge.py app_image_sync.py
      - name: Sanity checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          b=Path('bot.py').read_text(encoding='utf-8')
          s=Path('sync_wrapper.py').read_text(encoding='utf-8')
          assert 'load_books()\n    load_orders()' in b
          assert 'book.get("photo_id", "") or book.get("image_url", "")' in b
          assert 'def _book_fingerprint' in s
          assert 'last_book_fingerprints' in s
          assert 'changed.append(book)' in s
          assert 'Bot → ilova kitob o‘chirildi' in s
          print('sync hardening sanity OK')
          PY
      - name: Commit patch and cleanup
        run: |
          rm -f sync_hardening_patch.py .github/workflows/sync-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py sync_wrapper.py sync_hardening_patch.py .github/workflows/sync-hardening.yml
          git commit -m "Harden live bot app synchronization"
          git push
