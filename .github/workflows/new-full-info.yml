name: New full customer info
on:
  push:
    paths: ['.github/new-full-info.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bot.py'); t=p.read_text(encoding='utf-8')
          old='''    if data == "saved_new_address":
        state = states.get(chat_id)
        if not state or state.get("action") != "confirm_saved_info":
            return
        state["action"] = "order_saved_address"
        send(
            chat_id,
            "📍 Yangi manzil va xona raqamini to‘liq yozing.\\n\\n"
            "Masalan: 경상북도 경산시 계양로 37길 7-3, 808호"
        )
        return
'''
          new='''    if data == "saved_new_address":
        state = states.get(chat_id)
        if not state or state.get("action") != "confirm_saved_info":
            return
        # Boshqa ma’lumotlar tanlansa ism, telefon va manzil qaytadan olinadi.
        state.pop("name", None)
        state.pop("phone", None)
        state.pop("address", None)
        state["action"] = "order_name"
        send(chat_id, "📝 Yangi buyurtma uchun ismingizni yozing:")
        return
'''
          assert t.count(old)==1, t.count(old)
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
      - run: python -m py_compile bot.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Ask for full customer info on alternate address"
          git push origin main
