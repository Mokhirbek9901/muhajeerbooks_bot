name: Fix Assasin legacy re-add

on:
  push:
    paths:
      - '.github/fix_assasin_legacy.py'
      - '.github/workflows/fix_assasin_legacy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch bot
        run: python .github/fix_assasin_legacy.py
      - name: Validate
        run: |
          python -m py_compile bot.py cloud_bridge.py sync_wrapper.py
          grep -q 'ASSASIN_LEGACY_CLEANUP_20260908' bot.py
          if grep -q 'GitHub orqali qo‘shilgan kitob: mavjud bo‘lmasa' bot.py; then
            echo 'Legacy Assasin auto-add block still exists'
            exit 1
          fi
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Remove legacy Assasin auto re-add'
          git push origin HEAD:main
