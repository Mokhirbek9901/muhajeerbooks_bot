name: Run shared postal queue cloud patch

on:
  push:
    paths:
      - 'shipping_queue_cloud_trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cloud queue patch
        run: python apply_shipping_queue_cloud_patch.py
      - name: Syntax check
        run: python -m py_compile bot.py cloud_bridge.py
      - name: Commit shared queue integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync postal queue across bot web and app"
            git push
          fi
