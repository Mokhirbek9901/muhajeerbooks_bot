name: Remove delivered statistic

on:
  push:
    paths:
      - '.github/remove-delivered-stat.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove delivered line from sales report
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          text = p.read_text(encoding='utf-8')
          old = '        f"✅ Yetkazilgan: {delivered} ta",\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected delivered report line once, found {text.count(old)}')
          text = text.replace(old, '', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Syntax check
        run: python -m py_compile bot.py
      - name: Commit bot.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet && exit 0
          git commit -m "Remove delivered count from sales statistics"
          git push origin main
