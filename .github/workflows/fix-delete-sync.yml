name: Fix bidirectional book deletion sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-delete-sync.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sync logic
        run: python3 tools/fix_delete_sync.py
      - name: Syntax check
        run: python3 -m py_compile sync_wrapper.py app_image_sync.py bot.py
      - name: Commit production fix and cleanup
        run: |
          rm .github/workflows/fix-delete-sync.yml
          rm tools/fix_delete_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync_wrapper.py app_image_sync.py .github/workflows/fix-delete-sync.yml tools/fix_delete_sync.py
          git commit -m "Fix two-way book deletion and inventory sync"
          git push
