name: Fix Telegram long-poll timeout 2026-09-10

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_getupdates_timeout_20260910.py'
      - '.github/workflows/fix_getupdates_timeout_20260910.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch getUpdates timeout
        run: python3 tools/fix_getupdates_timeout_20260910.py
      - name: Verify bot
        run: |
          python3 -m py_compile bot.py sync_wrapper.py cloud_bridge.py
          python3 - <<'PY'
          from pathlib import Path
          bot = Path('bot.py').read_text(encoding='utf-8')
          if 'http_timeout = 65 if method == "getUpdates" else 40' not in bot:
              raise SystemExit('Long-poll timeout fix missing')
          if 'params = {"timeout": 50}' not in bot:
              raise SystemExit('Telegram long-poll timeout unexpectedly changed')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Fix Telegram getUpdates long-poll timeout"
          git push
