name: Simplify order flow

on:
  push:
    paths:
      - '.github/simplify-order-flow.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch bot
        run: python .github/patch_simplify_order_flow.py
      - name: Syntax check
        run: python -m py_compile bot.py
      - name: Commit bot.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet && exit 0
          git commit -m "Simplify admin order flow"
          git push origin main
