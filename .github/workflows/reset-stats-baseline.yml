name: Reset statistics baseline

on:
  push:
    paths:
      - '.github/reset-stats-baseline.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reset report statistics baseline without deleting data
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot.py')
          text = path.read_text(encoding='utf-8')

          marker = 'LOW_STOCK_LIMIT = 2\n'
          constant = 'STATS_RESET_ORDER_ID = 1788693321000  # 2026-09-06 16:15:21 Asia/Tashkent\n'
          if constant not in text:
              if marker not in text:
                  raise SystemExit('LOW_STOCK_LIMIT marker not found')
              text = text.replace(marker, marker + constant, 1)

          old = '    selected = [o for o in orders.values() if included(o)]\n'
          new = '    selected = [o for o in orders.values() if included(o) and int(o.get("order_id", 0) or 0) >= STATS_RESET_ORDER_ID]\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected report selected line once, found {count}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Python syntax
        run: python -m py_compile bot.py

      - name: Commit reset baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet || git commit -m "Reset statistics baseline without deleting orders"
          git push
