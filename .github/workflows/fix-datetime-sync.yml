name: Fix datetime sync

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_datetime_sync.py'
      - '.github/workflows/fix-datetime-sync.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/fix_datetime_sync.py
      - name: Syntax check
        run: python3 -m py_compile bot.py sync_wrapper.py cloud_bridge.py
      - name: Sanity check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('bot.py').read_text(encoding='utf-8')
          assert 'def _local_datetime' in t
          assert 'datetime.fromisoformat(raw)' not in t
          print('datetime sanity OK')
          PY
      - name: Commit fix and cleanup
        run: |
          rm -f tools/fix_datetime_sync.py .github/workflows/fix-datetime-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py tools/fix_datetime_sync.py .github/workflows/fix-datetime-sync.yml
          git commit -m "Fix mixed timezone datetime crashes"
          git push
